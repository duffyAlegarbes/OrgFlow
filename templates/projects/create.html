{% extends 'base.html' %}
{% load static %}

{% block title %}Create Project - {{ org.name }}{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/projects/projects.css' %}">

<div class="row justify-content-center my-4">
    <div class="col-lg-8 col-md-10">
        <div class="card card-orgflow shadow-sm">
            <div class="card-header card-header-org py-3">
                <h4 class="mb-0 fs-5"><i class="bi bi-kanban me-2 text-warning"></i>Plan New Student Project</h4>
            </div>

            <form method="post" class="p-4">
                {% csrf_token %}

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger py-2 small mb-3">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label fw-bold small text-garnet">Project Title <span class="text-danger">*</span></label>
                        <input type="text" name="title" class="form-control" placeholder="e.g. 2025 Tech Fest & Hackathon" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold small text-garnet">Initial Status</label>
                        <select name="status" class="form-select">
                            {% for key, label in statuses %}
                                <option value="{{ key }}" {% if key == 'Planning' %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold small text-garnet">Start Date</label>
                        <input type="date" name="date_start" class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold small text-garnet">End Date</label>
                        <input type="date" name="date_end" class="form-control">
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-bold small text-garnet">Allocated Budget (₱)</label>
                        <input type="number" step="0.01" name="budget_allocated" class="form-control" placeholder="0.00" value="0.00">
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-bold small text-garnet">Project Description & Objectives <span class="text-danger">*</span></label>
                        <textarea name="description" class="form-control" rows="5" placeholder="Detail the target audience, expected outcomes, and schedule..." required></textarea>
                    </div>
                </div>

                <div class="mt-4 pt-3 border-top d-flex justify-content-between align-items-center">
                    <a href="{% url 'projects:list' org_slug=org.slug %}" class="btn btn-outline-secondary btn-sm">Cancel</a>
                    <button type="submit" class="btn btn-org-primary">
                        <i class="bi bi-check-circle-fill me-1"></i>Create Project
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="{% static 'js/projects/projects.js' %}"></script>
{% endblock %}
