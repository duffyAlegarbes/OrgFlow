<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OrgFlow{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts & Bootstrap Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --soft-gold: #F6E6C9;
            --harvest-gold: #DAA520;
            --crimson-maroon: #990000;
            --deep-garnet: #6B2E1E;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--soft-gold);
            color: var(--deep-garnet);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar Styling */
        .navbar-orgflow {
            background-color: var(--crimson-maroon);
            border-bottom: 4px solid var(--harvest-gold);
            box-shadow: 0 4px 12px rgba(107, 46, 30, 0.15);
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
            color: var(--soft-gold) !important;
        }

        .navbar-brand span {
            color: var(--harvest-gold);
        }

        /* Button Styling */
        .btn-org-primary {
            background-color: var(--crimson-maroon);
            color: var(--white);
            border: 2px solid var(--crimson-maroon);
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-org-primary:hover {
            background-color: var(--deep-garnet);
            color: var(--soft-gold);
            border-color: var(--deep-garnet);
        }

        .btn-org-outline {
            background-color: transparent;
            color: var(--harvest-gold);
            border: 2px solid var(--harvest-gold);
            font-weight: 600;
        }

        .btn-org-outline:hover {
            background-color: var(--harvest-gold);
            color: var(--deep-garnet);
        }

        /* Card Customization */
        .card-orgflow {
            background-color: var(--white);
            border: 1px solid rgba(107, 46, 30, 0.12);
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(107, 46, 30, 0.06);
        }

        .card-header-org {
            background-color: var(--crimson-maroon);
            color: var(--soft-gold);
            font-weight: 700;
            border-top-left-radius: 11px !important;
            border-top-right-radius: 11px !important;
        }

        /* Form Inputs */
        .form-control:focus, .form-select:focus {
            border-color: var(--harvest-gold);
            box-shadow: 0 0 0 0.25rem rgba(218, 165, 32, 0.25);
        }

        .form-label {
            font-weight: 600;
            color: var(--deep-garnet);
        }

        /* Footer */
        footer {
            margin-top: auto;
            background-color: var(--deep-garnet);
            color: var(--soft-gold);
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-orgflow py-3">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">
                <i class="bi bi-diagram-3-fill me-2"></i>Org<span>Flow</span>
            </a>
            
            <div>
                {% if user.is_authenticated %}
                    <span class="text-white me-3 d-none d-sm-inline">
                        <i class="bi bi-person-badge-fill me-1" style="color: var(--harvest-gold);"></i>
                        <strong>{{ user.username }}</strong>
                    </span>
                    <form action="{% url 'logout' %}" method="post" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-org-outline btn-sm">
                            <i class="bi bi-box-arrow-right me-1"></i>Logout
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-org-outline btn-sm me-2">Login</a>
                    <a href="{% url 'register' %}" class="btn btn-org-primary btn-sm">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container my-5">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="py-3 text-center">
        <div class="container">
            <small>&copy; 2026 <strong>OrgFlow</strong> – School Organizational Management System</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
