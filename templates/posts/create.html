{% extends 'base.html' %}
{% load static %}

{% block title %}Publish Post - OrgFlow{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/posts/posts.css' %}">

<div class="row justify-content-center my-4">
    <div class="col-lg-8 col-md-10">
        <div class="card card-orgflow shadow-sm">
            <div class="card-header card-header-org py-3">
                <h4 class="mb-0 fs-5"><i class="bi bi-pencil-square me-2 text-warning"></i>Publish Organization Post</h4>
            </div>

            <form method="post" class="p-4">
                {% csrf_token %}

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger py-2 small mb-3">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <div class="row g-3">
                    <!-- Select Organization (Anti-Impersonation Restricted) -->
                    <div class="col-md-6">
                        <label class="form-label fw-bold small text-garnet">Posting On Behalf Of <span class="text-danger">*</span></label>
                        <select name="organization_id" class="form-select" required>
                            {% for m in officer_memberships %}
                                <option value="{{ m.organization.id }}" {% if preselect_slug == m.organization.slug %}selected{% endif %}>
                                    {{ m.organization.name }} ({{ m.role }})
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Post Type -->
                    <div class="col-md-6">
                        <label class="form-label fw-bold small text-garnet">Post Category <span class="text-danger">*</span></label>
                        <select name="post_type" id="postTypeSelect" class="form-select" required>
                            {% for key, label in post_types %}
                                <option value="{{ key }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Dynamic Partnership Request Fields (Hidden unless Partnership is selected) -->
                    <div class="col-12 d-none" id="partnershipFields">
                        <div class="p-3 bg-light border border-warning rounded-3">
                            <h6 class="fw-bold text-garnet mb-2"><i class="bi bi-handshake-fill me-1 text-gold"></i>Partnership Requirements</h6>
                            <label class="form-label small fw-semibold">Target Partner Category / Organization Type</label>
                            <select name="target_category" class="form-select form-select-sm">
                                <option value="Any Student Organization">Any Student Organization</option>
                                {% for key, label in target_categories %}
                                    <option value="{{ label }}">{{ label }}</option>
                                {% endfor %}
                                <option value="External Sponsors / Industry">External Sponsors / Industry</option>
                            </select>
                        </div>
                    </div>

                    <!-- Title -->
                    <div class="col-12">
                        <label class="form-label fw-bold small text-garnet">Headline / Title <span class="text-danger">*</span></label>
                        <input type="text" name="title" class="form-control" placeholder="e.g. Call for Co-Organizers: Regional DevFest 2025" required>
                    </div>

                    <!-- Content -->
                    <div class="col-12">
                        <label class="form-label fw-bold small text-garnet">Post Body / Details <span class="text-danger">*</span></label>
                        <textarea name="content" class="form-control" rows="6" placeholder="Write your announcement, event schedule, or partnership proposal here..." required></textarea>
                    </div>
                </div>

                <div class="mt-4 pt-3 border-top d-flex justify-content-between align-items-center">
                    <a href="{% url 'posts:feed' %}" class="btn btn-outline-secondary btn-sm">Cancel</a>
                    <button type="submit" class="btn btn-org-primary">
                        <i class="bi bi-send-fill me-1"></i>Publish to Feed
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="{% static 'js/posts/posts.js' %}"></script>
{% endblock %}
