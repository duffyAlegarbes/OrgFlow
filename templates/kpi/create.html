{% extends 'base.html' %}
{% load static %}

{% block title %}Set KPI Target - {{ org.name }}{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/kpi/kpi.css' %}">

<div class="row justify-content-center my-4">
    <div class="col-lg-7 col-md-9">
        <div class="card card-orgflow overflow-hidden">
            <div class="card-header card-header-org py-3 px-4">
                <h4 class="mb-0 fs-5"><i class="bi bi-graph-up me-2 text-warning"></i>Define Organizational KPI Target</h4>
            </div>

            <form method="post" class="p-4 p-lg-5 bg-white">
                {% csrf_token %}

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger py-2 small mb-3 rounded-3">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <div class="mb-3">
                    <label class="form-label fw-bold small text-dark">University Student Agenda Pillar <span class="text-danger">*</span></label>
                    <select name="agenda_id" class="form-select cit-input" required>
                        {% for a in agendas %}
                            <option value="{{ a.id }}">{{ a.title }} ({{ a.academic_year }})</option>
                        {% empty %}
                            <option value="" disabled>No agendas defined in system</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small text-dark">Metric Title / Objective <span class="text-danger">*</span></label>
                    <input type="text" name="metric_name" class="form-control cit-input" placeholder="e.g. Total Student Attendees at Tech Summit" required>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label fw-bold small text-dark">Target Goal (Number) <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" name="target_value" class="form-control cit-input" placeholder="e.g. 250" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-bold small text-dark">Initial Count Achieved</label>
                        <input type="number" step="0.01" name="achieved_value" class="form-control cit-input" value="0.00">
                    </div>
                </div>

                <div class="mt-4 pt-3 border-top d-flex justify-content-between align-items-center">
                    <a href="{% url 'kpi:dashboard' org_slug=org.slug %}" class="btn btn-light border rounded-pill btn-sm px-3 fw-semibold">Cancel</a>
                    <button type="submit" class="btn btn-org-primary px-4">
                        <i class="bi bi-check-circle-fill"></i><span>Establish Target</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="{% static 'js/kpi/kpi.js' %}"></script>
{% endblock %}
