{% extends 'base.html' %}

{% block title %}Login - OrgFlow{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-5">
        <div class="card card-orgflow">
            <div class="card-header card-header-org text-center py-3">
                <h4 class="mb-0 fs-5"><i class="bi bi-shield-lock-fill me-2"></i>Officer & Member Login</h4>
            </div>
            <div class="card-body p-4">
                
                {% if form.errors %}
                    <div class="alert alert-danger py-2 small">
                        <strong>Invalid credentials.</strong> Please check your username and password.
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" id="id_username" required placeholder="Enter your username">
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" id="id_password" required placeholder="Enter your password">
                    </div>

                    <button type="submit" class="btn btn-org-primary w-100 py-2 mt-2">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Log In
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <small style="color: var(--deep-garnet);">
                        Don't have an account yet? 
                        <a href="{% url 'register' %}" class="fw-bold" style="color: var(--crimson-maroon);">Register here</a>
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
